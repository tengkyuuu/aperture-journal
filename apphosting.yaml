# Firebase App Hosting runtime configuration.
#
# ══ NOTE WHAT IS ABSENT: GEMINI_API_KEY ══
#
# App Hosting can inject Secret Manager values as environment variables here,
# and for most apps that is the right call. We deliberately do not. Fetching
# the key through the Secret Manager client at runtime makes the dependency
# explicit and auditable, and a key rotation then takes effect within one cache
# TTL instead of requiring a redeploy. See lib/server/secrets.ts.
#
# ══ WHY THE WEB API KEY IS COMMITTED ══
#
# NEXT_PUBLIC_FIREBASE_API_KEY is public by design. It ships inside the browser
# bundle on every request, it identifies the project rather than authorising
# anything, and Google documents it as public. What protects the data is
# Firestore rules, referrer restrictions, and App Check — not the secrecy of
# this string. Hiding it would be theatre, and theatre is worse than nothing
# because it teaches the next person that it is a secret.
#
# `npm run verify:no-secrets -- --history` proves the point: it scans the git
# history for key patterns and allows exactly this one value, failing on any
# other.

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: aperture-journal
    availability:
      - RUNTIME

  - variable: GEMINI_SECRET_NAME
    value: GEMINI_API_KEY
    availability:
      - RUNTIME

  # App Check enforcement. Set to 1 only once NEXT_PUBLIC_APPCHECK_SITE_KEY is
  # populated — enforcing without a site key locks every user out.
  # See lib/server/appcheck.ts.
  - variable: APPCHECK_ENFORCE
    value: "0"
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCaW1cn3pw2LvsTpP7sMbyCQB6ij0xdZGY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: aperture-journal.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: aperture-journal
    availability:
      - BUILD
      - RUNTIME
