<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aperture">
  <!--
    The rail mark, at tab size. An aperture ring around a serif A: the ring
    reads at 16px where the letterform alone would turn to mush, and the letter
    carries it at 32px and above.
  -->
  <rect width="64" height="64" rx="14" fill="#0B0B0C"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#6B7BD6" stroke-width="1.6" opacity="0.55"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#6B7BD6" stroke-width="3.2"
          stroke-linecap="round" stroke-dasharray="12 120" transform="rotate(-52 32 32)"/>
  <text x="32" y="43.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="300"
        fill="#F3EFE7">A</text>
</svg>
